# Samba configuration for honeypot

[global]
   workgroup = WORKGROUP
   server string = File Server
   server role = standalone server
   log file = /opt/honeypot/logs/samba.log
   max log size = 50
   dns proxy = no
   path = /opt/honeypot/shares

   # Security settings
   security = user
   encrypt passwords = true
   passdb backend = tdbsam

   # Disable printing
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # Logging
   log level = 2

   # Network settings
   socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=65536 SO_SNDBUF=65536

   # Disable NetBIOS
   disable netbios = yes

   # Use SMB1 protocol (older, less secure version for honeypot)
   server min protocol = NT1
   server max protocol = NT1

[public]
   comment = Public Shares
   path = /opt/honeypot/shares/public
   browseable = yes
   writable = yes
   guest ok = yes
   read only = no
   create mask = 0777
   directory mask = 0777

[private]
   comment = Private Shares
   path = /opt/honeypot/shares/private
   browseable = yes
   writable = yes
   guest ok = no
   read only = no
   valid users = honeypot
   create mask = 0770
   directory mask = 0770
